[package]
name = "video-cleaner"
version = "0.1.0"
description = "Local batch video cleaner for macOS"
authors = ["VideoCleaner"]
edition = "2021"

[lib]
name = "video_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
dirs = "5.0.1"
rusqlite = "0.32.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.0.0", default-features = false, features = ["wry"] }
thiserror = "2.0.3"
uuid = { version = "1.10.0", features = ["v4"] }
